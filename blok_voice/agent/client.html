<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLOK Voice Copilot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 400px;
      max-width: 92vw;
      text-align: center;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: .25rem; }
    .subtitle { font-size: .85rem; color: #86868b; margin-bottom: 1.5rem; }

    .badge {
      display: inline-block;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .25rem .75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    .state-idle, .state-ended { background: #e8e8ed; color: #6e6e73; }
    .state-connecting { background: #fff3cd; color: #856404; }
    .state-connected { background: #d4edda; color: #155724; }
    .state-error { background: #f8d7da; color: #721c24; }

    .voice {
      height: 8px;
      border-radius: 999px;
      background: #e8e8ed;
      margin: 0 auto 1.5rem;
      width: 80%;
      overflow: hidden;
    }
    .voice > div {
      height: 100%;
      width: 0%;
      background: #28a745;
      transition: width .12s linear;
    }

    .btn {
      font-size: .95rem;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      padding: .7rem 1.4rem;
      cursor: pointer;
      margin: .25rem;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-start { background: #0071e3; color: #fff; }
    .btn-end { background: #ff3b30; color: #fff; }

    .hint { margin-top: 1rem; font-size: .8rem; color: #86868b; min-height: 1.2em; }
    .error-msg { margin-top: .5rem; font-size: .85rem; color: #ff3b30; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BLOK Voice Copilot</h1>
    <p class="subtitle">Assistant vocal — matériaux de construction</p>

    <div><span id="badge" class="badge state-idle">En attente</span></div>
    <div class="voice" title="Activité vocale de l'agent"><div id="level"></div></div>

    <button id="startBtn" class="btn btn-start">Démarrer la conversation</button>
    <button id="endBtn" class="btn btn-end" disabled>Terminer</button>

    <audio id="out" autoplay playsinline></audio>
    <p id="hint" class="hint"></p>
    <p id="error" class="error-msg" role="alert"></p>
  </div>

  <script>
    const badge = document.getElementById("badge")
    const startBtn = document.getElementById("startBtn")
    const endBtn = document.getElementById("endBtn")
    const audioEl = document.getElementById("out")
    const errorEl = document.getElementById("error")
    const hintEl = document.getElementById("hint")
    const levelEl = document.getElementById("level")

    let pc = null
    let micStream = null
    let audioCtx = null
    let analyser = null
    let levelTimer = null
    let inCall = false  // garde anti-clics répétés

    function setState(name, label) {
      badge.className = "badge state-" + name
      badge.textContent = label || name
    }

    function showError(msg) { errorEl.textContent = msg || "" }
    function showHint(msg) { hintEl.textContent = msg || "" }

    function stopLevelMeter() {
      if (levelTimer) { clearInterval(levelTimer); levelTimer = null }
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null }
      analyser = null
      levelEl.style.width = "0%"
    }

    function startLevelMeter(stream) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        const src = audioCtx.createMediaStreamSource(stream)
        analyser = audioCtx.createAnalyser()
        analyser.fftSize = 512
        src.connect(analyser)
        const buf = new Uint8Array(analyser.frequencyBinCount)
        levelTimer = setInterval(() => {
          if (!analyser) return
          analyser.getByteFrequencyData(buf)
          let sum = 0
          for (let i = 0; i < buf.length; i++) sum += buf[i]
          const pct = Math.min(100, Math.round((sum / buf.length / 255) * 100 * 2))
          levelEl.style.width = pct + "%"
        }, 120)
      } catch (e) {
        // indicateur indisponible : la voix reste audible sans lui
        stopLevelMeter()
      }
    }

    function cleanup() {
      stopLevelMeter()
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null }
      if (pc) { try { pc.close() } catch (e) {} pc = null }
      audioEl.srcObject = null
    }

    function endCall(reason) {
      cleanup()
      inCall = false
      endBtn.disabled = true
      startBtn.disabled = false
      if (reason !== "error") {
        setState("ended", "Terminée")
        showHint("Conversation terminée. Vous pouvez en démarrer une nouvelle.")
      }
    }

    async function waitForIceComplete(pc, timeoutMs) {
      if (pc.iceGatheringState === "complete") return
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pc.onicegatheringstatechange = null
          reject(new Error("La collecte ICE a pris trop de temps (réseau ?). Réessayez."))
        }, timeoutMs)
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === "complete") {
            clearTimeout(timer)
            pc.onicegatheringstatechange = null
            resolve()
          }
        }
      })
    }

    startBtn.onclick = async () => {
      if (inCall) return  // protection contre les clics répétés
      inCall = true
      startBtn.disabled = true
      showError("")
      showHint("Initialisation…")

      let sessionId = null
      try {
        setState("connecting", "Connexion…")

        // 1. Microphone d'abord : échec clair si refusé ou absent.
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true })
        } catch (e) {
          if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) {
            throw new Error("Accès au microphone refusé. Autorisez le micro dans le navigateur puis réessayez.")
          }
          if (e && e.name === "NotFoundError") {
            throw new Error("Aucun microphone détecté sur cet appareil.")
          }
          throw new Error("Microphone indisponible : " + (e.message || e.name || "erreur inconnue"))
        }

        // 2. Créer la session côté backend (qui appelle AethexAI).
        showHint("Création de la session…")
        let res
        try {
          res = await fetch("/session", { method: "POST" })
        } catch (e) {
          throw new Error("Serveur injoignable. Vérifiez que le backend tourne sur le port 5000.")
        }
        let data = null
        try { data = await res.json() } catch (e) { data = null }
        if (!res.ok) {
          throw new Error((data && data.error) || `Échec de session (HTTP ${res.status}).`)
        }
        sessionId = data && data.session_id
        const iceConfig = (data && data.ice_config) || null
        if (!sessionId) throw new Error("Session invalide reçue du serveur. Réessayez.")

        // 3. WebRTC : paire + pistes micro.
        pc = new RTCPeerConnection(iceConfig || undefined)
        micStream.getTracks().forEach(t => pc.addTrack(t, micStream))

        pc.ontrack = (ev) => {
          audioEl.srcObject = ev.streams[0]
          startLevelMeter(ev.streams[0])
        }
        pc.onconnectionstatechange = () => {
          if (!pc) return
          if (pc.connectionState === "connected") {
            setState("connected", "Connecté — parlez !")
            showHint("L'agent vous écoute. Parlez naturellement en français.")
          } else if (pc.connectionState === "failed") {
            showError("Connexion WebRTC interrompue (réseau ?). La session est fermée.")
            endCall("error")
            setState("error", "Erreur")
          } else if (pc.connectionState === "closed" || pc.connectionState === "disconnected") {
            endCall("ended")
          }
        };

        // 4. Offre SDP -> backend -> AethexAI, puis réponse appliquée.
        showHint("Négociation audio…")
        const offer = await pc.createOffer()
        await pc.setLocalDescription(offer)
        await waitForIceComplete(pc, 10000)

        const { sdp, type } = pc.localDescription
        let answerRes
        try {
          answerRes = await fetch(`/session/${encodeURIComponent(sessionId)}/offer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sdp, type }),
          })
        } catch (e) {
          throw new Error("Serveur injoignable pendant la négociation. Réessayez.")
        }
        let answer = null
        try { answer = await answerRes.json() } catch (e) { answer = null }
        if (!answerRes.ok) {
          throw new Error((answer && answer.error) || `Échec de négociation (HTTP ${answerRes.status}).`)
        }
        if (!answer || !answer.sdp) throw new Error("Réponse audio incomplète. Réessayez.")
        await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type || "answer" })

        setState("connecting", "En ligne…")
        showHint("Connexion établie. L'agent va vous saluer.")
        endBtn.disabled = false
      } catch (err) {
        showError(err && err.message ? err.message : String(err))
        setState("error", "Erreur")
        endCall("error")
      }
    }

    endBtn.onclick = () => endCall("ended")
    window.addEventListener("beforeunload", cleanup)
  </script>
</body>
</html>
