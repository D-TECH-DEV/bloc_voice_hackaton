# Développement local : chargé automatiquement avec docker-compose.yml.
# Bind mounts des sources (hot reload, aucun rebuild à chaque modification),
# ports publiés sur 127.0.0.1 uniquement, volumes nommés pour node_modules
# (le bind ne doit jamais masquer les dépendances du conteneur).
# La base (docker-compose.yml) reste la source de vérité : build, env,
# healthchecks, dépendances. Ici uniquement les deltas du poste développeur.

services:
  backend-api:
    env_file:
      - .env.docker
    environment:
      # Le bind hôte traverse mal les FS virtualisés (Docker Desktop) : le
      # watcher dev raterait les modifications sans polling (stale code).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3001:3001"
    command: ["npm", "run", "start:dev"]

  frontend-commercial:
    env_file:
      - .env.docker
    environment:
      # Même raison : garantir que chaque modification hôte recompile.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]

  voice-agent:
    env_file:
      - .env.docker
    volumes:
      # Sources seules : le venv vit dans l'image (/opt/venv), jamais masqué.
      - ./blok_voice/agent:/app/agent
    ports:
      - "127.0.0.1:5000:5000"
    command: ["flask", "--app", "agent.server", "run", "--host", "0.0.0.0", "--port", "5000", "--reload"]
