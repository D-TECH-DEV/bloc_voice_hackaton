
name: blok-relance

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-blok_relance}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env.docker}"
      POSTGRES_DB: "${POSTGRES_DB:-blok_relance}"
    volumes:
      # PG18 exige UN seul montage au parent : l'image crée 18/docker dessous.
      # Monter .../data directement fait échouer l'entrypoint (voir docker-entrypoint.sh).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bloknet

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER:-blok_relance}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}"
      DB_NAME: "${POSTGRES_DB:-blok_relance}"
    command: ["npm", "run", "migration:run"]
    networks:
      - bloknet

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER:-blok_relance}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}"
      DB_NAME: "${POSTGRES_DB:-blok_relance}"
      CORE_API_BASE_URL: "${CORE_API_BASE_URL:-https://core-api-dev.blok.africa/api/external}"
      CORE_API_KEY: "${CORE_API_KEY:-}"
      CORE_API_TIMEOUT_MS: "${CORE_API_TIMEOUT_MS:-8000}"
      MOCK_CORE: "${MOCK_CORE:-true}"
      ENABLE_CORE_WRITES: "${ENABLE_CORE_WRITES:-false}"
      VOICE_TOOL_SECRET: "${VOICE_TOOL_SECRET:?VOICE_TOOL_SECRET requis}"
      OPERATOR_ADMIN_TOKEN: "${OPERATOR_ADMIN_TOKEN:?OPERATOR_ADMIN_TOKEN requis}"
      OPERATOR_SALES_TOKEN: "${OPERATOR_SALES_TOKEN:?OPERATOR_SALES_TOKEN requis}"
      BUSINESS_TIMEZONE: "${BUSINESS_TIMEZONE:-Africa/Abidjan}"
      OUTBOUND_CALLS_ENABLED: "false"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3001}:3001"
    networks:
      - bloknet

  frontend-commercial:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend-api:3001
      OPERATOR_TOKEN: "${OPERATOR_SALES_TOKEN:?OPERATOR_SALES_TOKEN requis}"
      OPERATOR_ADMIN_TOKEN: "${OPERATOR_ADMIN_TOKEN:?OPERATOR_ADMIN_TOKEN requis}"
      # Proxy vocal appelé par le NAVIGATEUR (pas depuis le conteneur) :
      # adresse du poste utilisateur, port publié par l'override (dev local).
      VOICE_URL: "${VOICE_URL:-http://127.0.0.1:5000}"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - bloknet

  voice-agent:
    build:
      context: ./blok_voice
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AETHEX_API_KEY: "${AETHEX_API_KEY:-}"
      AGENT_ID: "${AGENT_ID:-}"
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${VOICE_BIND:-127.0.0.1}:${VOICE_PORT:-5000}:5000"
    networks:
      - bloknet

volumes:
  pgdata: # Données PostgreSQL : survivent aux arrêts et recréations.
  backend_node_modules:
  frontend_node_modules:

networks:
  bloknet:
    driver: bridge
